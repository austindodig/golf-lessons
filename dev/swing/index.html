<!doctype html><html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dev: Swing Viewer</title><link rel="stylesheet" href="/src/styles/main.css" /><style>body{padding:100px 0}</style></head>
<body><div class="container"><div id="m"></div></div>
<script type="module">
  import { mountSwingViewer } from '/src/modules/SwingViewer.js';
  const q = new URLSearchParams(location.search);
  const v = mountSwingViewer(document.getElementById('m'), { club: q.get('club') || 'iron', camera: q.get('cam') || 'three-quarter', highlight: [1, 4, 7], caption: 'Scrub through the ten positions.' });
  if (q.get('p')) setTimeout(() => v.jumpTo(Number(q.get('p'))), 800);
  if (q.get('hit')) setTimeout(() => v.hitAndFollow(), 600);
</script></body></html>
